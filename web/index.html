<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M5 Multipass Configurator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
      margin-right: 8px;
      transition: background 0.3s;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.error     { background: #ef4444; }

    #status-text {
      font-size: 0.9rem;
      color: #555;
    }

    #btn-connect {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      background: #2563eb;
      color: white;
      transition: background 0.2s;
    }
    #btn-connect:hover { background: #1d4ed8; }
    #btn-connect:disabled { background: #93c5fd; cursor: not-allowed; }
    #btn-connect.disconnect { background: #6b7280; }
    #btn-connect.disconnect:hover { background: #4b5563; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #f8fafc;
      padding: 10px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    thead th:first-child { width: 42px; text-align: center; }
    thead th:last-child  { width: 72px; text-align: center; }

    tbody tr:nth-child(even) { background: #fafafa; }

    tbody td {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }
    tbody td:first-child {
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
      font-weight: 500;
    }
    tbody td:last-child { text-align: center; }

    tbody tr.disabled td:not(:first-child):not(:last-child) { opacity: 0.4; }

    input[type="text"] {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.2s;
      background: white;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    input[type="text"].error { border-color: #ef4444; }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #2563eb;
    }

    .card-msg {
      padding: 10px 20px;
      min-height: 36px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 16px 20px;
      border-top: 1px solid #eee;
    }

    .action-btns { display: flex; gap: 10px; }

    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #btn-read {
      background: #f1f5f9;
      color: #1e293b;
    }
    #btn-read:hover:not(:disabled) { background: #e2e8f0; }

    #btn-write {
      background: #16a34a;
      color: white;
    }
    #btn-write:hover:not(:disabled) { background: #15803d; }

    #msg {
      font-size: 0.85rem;
      color: #555;
      min-height: 20px;
      flex: 1;
    }
    #msg.ok    { color: #16a34a; }
    #msg.error { color: #ef4444; }

    .console-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-top: 1px solid #eee;
      background: #f8fafc;
    }
    .console-toggle button {
      font-size: 0.78rem;
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      color: #555;
      font-family: inherit;
    }
    .console-toggle button:hover { background: #e5e7eb; }

    #console {
      display: none;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: "JetBrains Mono", "Fira Mono", "Consolas", monospace;
      font-size: 0.75rem;
      padding: 12px 16px;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border-top: 1px solid #333;
    }
    #console.visible { display: block; }

    @media (max-width: 500px) {
      thead th:nth-child(3) { display: none; }
      tbody td:nth-child(3) { display: none; }
    }

    /* Confirmation modal */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #modal-overlay.visible { display: flex; }

    #modal {
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    #modal h2 {
      font-size: 1rem;
      font-weight: 600;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #eee;
      color: #1a1a2e;
    }

    #modal-slots {
      padding: 12px 20px;
      max-height: 260px;
      overflow-y: auto;
    }

    .modal-slot-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.88rem;
    }
    .modal-slot-row:last-child { border-bottom: none; }

    .modal-slot-num {
      width: 28px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: #aaa;
      flex-shrink: 0;
    }

    .modal-slot-labels {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .modal-slot-label {
      background: #f1f5f9;
      border-radius: 5px;
      padding: 3px 8px;
      font-family: "JetBrains Mono", "Fira Mono", monospace;
      font-size: 0.82rem;
      color: #1e293b;
    }

    .modal-slot-disabled {
      color: #aaa;
      font-size: 0.82rem;
      font-style: italic;
    }

    .modal-warning {
      margin: 0 20px 14px;
      background: #fef9c3;
      border: 1px solid #fde047;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.83rem;
      color: #713f12;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #eee;
    }

    #modal-cancel {
      background: #f1f5f9;
      color: #1e293b;
    }
    #modal-cancel:hover { background: #e2e8f0; }

    #modal-confirm {
      background: #16a34a;
      color: white;
    }
    #modal-confirm:hover { background: #15803d; }
  </style>
</head>
<body>

<div id="modal-overlay">
  <div id="modal">
    <h2>Confirm Write to Device</h2>
    <div id="modal-slots"></div>
    <div class="modal-warning">
      The device will reboot and disconnect automatically after writing.
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn" id="modal-confirm">Write &amp; Reboot</button>
    </div>
  </div>
</div>

<h1>M5 Multipass Configurator</h1>
<p class="subtitle">Configure switch labels via USB serial &mdash; Chrome / Edge only</p>

<div class="card">
  <div class="card-header">
    <span>
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </span>
    <button id="btn-connect">Connect</button>
  </div>

  <div class="card-msg">
    <div id="msg"></div>
  </div>

  <div id="config-section" style="display:none">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Line 1 (up to 8 chars)</th>
          <th>Line 2 (up to 8 chars)</th>
          <th>Enabled</th>
        </tr>
      </thead>
      <tbody id="slots">
      </tbody>
    </table>

    <div class="card-footer">
      <div class="action-btns">
        <button class="btn" id="btn-read" disabled>Read from Device</button>
        <button class="btn" id="btn-write" disabled>Write to Device</button>
      </div>
    </div>
  </div>

  <div class="console-toggle">
    <button id="btn-toggle-console">Show Log</button>
    <span style="font-size:0.78rem;color:#999">Raw serial log output</span>
  </div>
  <div id="console"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Minimal CBOR encoder / decoder (no external dependencies)
// Supports: positive int, text string, byte string, array, map, bool, null
// ---------------------------------------------------------------------------

const CBOR = (() => {
  // --- encode ---
  function encodeUint(n) {
    if (n < 24)       return [n];
    if (n < 0x100)    return [24, n];
    if (n < 0x10000)  return [25, n >> 8, n & 0xff];
    return [26, (n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff];
  }

  function encode(val) {
    if (val === null || val === undefined) return [0xf6];
    if (val === true)  return [0xf5];
    if (val === false) return [0xf4];

    if (typeof val === 'number') {
      if (Number.isInteger(val) && val >= 0) {
        const h = encodeUint(val);
        return [(h[0] & 0x1f) | 0x00, ...h.slice(1)];
      }
      throw new Error('Only unsigned integers supported');
    }

    if (typeof val === 'string') {
      const bytes = new TextEncoder().encode(val);
      const h = encodeUint(bytes.length);
      return [(h[0] & 0x1f) | 0x60, ...h.slice(1), ...bytes];
    }

    if (Array.isArray(val)) {
      const h = encodeUint(val.length);
      const items = [(h[0] & 0x1f) | 0x80, ...h.slice(1)];
      for (const v of val) items.push(...encode(v));
      return items;
    }

    if (typeof val === 'object') {
      const keys = Object.keys(val);
      const h = encodeUint(keys.length);
      const items = [(h[0] & 0x1f) | 0xa0, ...h.slice(1)];
      for (const k of keys) {
        items.push(...encode(k));
        items.push(...encode(val[k]));
      }
      return items;
    }

    throw new Error('Unsupported type: ' + typeof val);
  }

  function toBytes(val) {
    return new Uint8Array(encode(val));
  }

  // --- decode ---
  function readUint(buf, pos, addl) {
    if (addl < 24) return { val: addl, end: pos };
    if (addl === 24) return { val: buf[pos], end: pos + 1 };
    if (addl === 25) return { val: (buf[pos] << 8) | buf[pos+1], end: pos + 2 };
    if (addl === 26) {
      const v = ((buf[pos] << 24) | (buf[pos+1] << 16) | (buf[pos+2] << 8) | buf[pos+3]) >>> 0;
      return { val: v, end: pos + 4 };
    }
    throw new Error('Unsupported additional info: ' + addl);
  }

  function decodeAt(buf, pos) {
    const b = buf[pos++];
    const mt = b >> 5;
    const addl = b & 0x1f;

    if (mt === 0) { // uint
      const r = readUint(buf, pos, addl);
      return { val: r.val, end: r.end };
    }
    if (mt === 2) { // bytes
      const r = readUint(buf, pos, addl);
      return { val: buf.slice(r.end, r.end + r.val), end: r.end + r.val };
    }
    if (mt === 3) { // text
      const r = readUint(buf, pos, addl);
      const str = new TextDecoder().decode(buf.slice(r.end, r.end + r.val));
      return { val: str, end: r.end + r.val };
    }
    if (mt === 4) { // array
      const r = readUint(buf, pos, addl);
      pos = r.end;
      const arr = [];
      for (let i = 0; i < r.val; i++) {
        const item = decodeAt(buf, pos);
        arr.push(item.val);
        pos = item.end;
      }
      return { val: arr, end: pos };
    }
    if (mt === 5) { // map
      const r = readUint(buf, pos, addl);
      pos = r.end;
      const obj = {};
      for (let i = 0; i < r.val; i++) {
        const k = decodeAt(buf, pos);
        pos = k.end;
        const v = decodeAt(buf, pos);
        pos = v.end;
        obj[k.val] = v.val;
      }
      return { val: obj, end: pos };
    }
    if (mt === 7) { // simple/float
      if (addl === 20) return { val: false, end: pos };
      if (addl === 21) return { val: true,  end: pos };
      if (addl === 22) return { val: null,  end: pos };
    }
    throw new Error('Unsupported CBOR major type ' + mt);
  }

  function decode(buf) {
    return decodeAt(buf, 0).val;
  }

  return { toBytes, decode };
})();

// ---------------------------------------------------------------------------
// SLIP framing (RFC 1055)
// ---------------------------------------------------------------------------

const SLIP_END     = 0xC0;
const SLIP_ESC     = 0xDB;
const SLIP_ESC_END = 0xDC;
const SLIP_ESC_ESC = 0xDD;

function slipEncode(data) {
  const out = [SLIP_END];
  for (const b of data) {
    if (b === SLIP_END) { out.push(SLIP_ESC, SLIP_ESC_END); }
    else if (b === SLIP_ESC) { out.push(SLIP_ESC, SLIP_ESC_ESC); }
    else { out.push(b); }
  }
  out.push(SLIP_END);
  return new Uint8Array(out);
}

// SLIP decoder — maintains state across chunks
class SlipDecoder {
  constructor(onFrame) {
    this.onFrame = onFrame;
    this.buf = [];
    this.esc = false;
    this.inFrame = false;
  }

  feed(chunk) {
    for (const b of chunk) {
      if (b === SLIP_END) {
        if (this.inFrame && this.buf.length > 0) {
          this.onFrame(new Uint8Array(this.buf));
        }
        this.buf = [];
        this.inFrame = true;
        this.esc = false;
      } else if (this.inFrame) {
        if (this.esc) {
          if      (b === SLIP_ESC_END) this.buf.push(SLIP_END);
          else if (b === SLIP_ESC_ESC) this.buf.push(SLIP_ESC);
          else                         this.buf.push(b);
          this.esc = false;
        } else if (b === SLIP_ESC) {
          this.esc = true;
        } else {
          this.buf.push(b);
        }
      }
    }
  }
}

// ---------------------------------------------------------------------------
// DOM references
// ---------------------------------------------------------------------------

const MAX_SLOTS = 16;

const btnConnect    = document.getElementById('btn-connect');
const btnRead       = document.getElementById('btn-read');
const btnWrite      = document.getElementById('btn-write');
const statusDot     = document.getElementById('status-dot');
const statusText    = document.getElementById('status-text');
const msgEl         = document.getElementById('msg');
const consoleEl     = document.getElementById('console');
const slotsBody     = document.getElementById('slots');
const btnToggle     = document.getElementById('btn-toggle-console');
const configSection = document.getElementById('config-section');
const cardMsg       = document.getElementById('msg').parentElement;

// Build table rows
for (let i = 0; i < MAX_SLOTS; i++) {
  const tr = document.createElement('tr');
  tr.id = `slot-${i}`;
  tr.innerHTML = `
    <td>${i + 1}</td>
    <td><input type="text" id="l1-${i}" maxlength="8" placeholder="Switch"></td>
    <td><input type="text" id="l2-${i}" maxlength="8" placeholder="${i + 1}"></td>
    <td><input type="checkbox" id="en-${i}"></td>
  `;
  slotsBody.appendChild(tr);
  document.getElementById(`en-${i}`).addEventListener('change', () => updateRowStyle(i));
}

function updateRowStyle(i) {
  const tr = document.getElementById(`slot-${i}`);
  tr.classList.toggle('disabled', !document.getElementById(`en-${i}`).checked);
}

btnToggle.addEventListener('click', () => {
  consoleEl.classList.toggle('visible');
  btnToggle.textContent = consoleEl.classList.contains('visible') ? 'Hide Log' : 'Show Log';
});

function log(text) {
  consoleEl.textContent += text + '\n';
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

// ---------------------------------------------------------------------------
// FSM
//
//  IDLE → CONNECTING → READING → READY ⇄ CONFIRMING
//           ↓              ↓        ↓           ↓
//    HANDSHAKE_FAILED    ERROR    ERROR       WRITING → REBOOTING → IDLE
// ---------------------------------------------------------------------------

let appState = 'IDLE';

// Per-state UI configuration
const STATE_UI = {
  //              dot          statusText              msg                        msgClass  config   read     write    connect     connectText  connectClass
  IDLE:          ['',          'Disconnected',         '',                        '',       false,   false,   false,   true,       'Connect',   ''],
  CONNECTING:    ['',          'Connecting\u2026',     'Connecting\u2026',        '',       false,   false,   false,   false,      'Connect',   ''],
  HANDSHAKE_FAILED: ['error',  'Not in config mode',   'Device is not in config mode. Hold the top button while powering on, then reconnect.',
                                                                                  'error',  false,   false,   false,   true,       'Connect',   ''],
  READING:       ['connected', 'Connected',            'Reading from device\u2026', '',     null,    false,   false,   true,       'Disconnect','disconnect'],
  READY:         ['connected', 'Connected',            'Read complete.',          'ok',     true,    true,    true,    true,       'Disconnect','disconnect'],
  CONFIRMING:    ['connected', 'Connected',            null,                      null,     true,    true,    true,    false,      'Disconnect','disconnect'],
  WRITING:       ['connected', 'Connected',            'Writing\u2026',           '',       true,    false,   false,   false,      'Disconnect','disconnect'],
  REBOOTING:     ['connected', 'Connected',            'Write OK \u2014 rebooting device\u2026', '', true, false, false, false,  'Disconnect','disconnect'],
  ERROR:         ['connected', 'Connected',            null,                      null,     true,    true,    true,    true,       'Disconnect','disconnect'],
};

function setState(newState, errorMsg) {
  appState = newState;
  log('[state] ' + newState + (errorMsg ? ': ' + errorMsg : ''));

  const ui = STATE_UI[newState];
  const [dot, sText, defaultMsg, msgClass, showConfig, readEn, writeEn, connectEn, connectText, connectClass] = ui;

  statusDot.className  = 'status-dot ' + dot;
  statusText.textContent = sText;

  // Message: explicit errorMsg > per-state default (null = keep current)
  if (errorMsg !== undefined) {
    msgEl.textContent = errorMsg;
    msgEl.className   = 'error';
  } else if (defaultMsg !== null) {
    msgEl.textContent = defaultMsg;
    msgEl.className   = msgClass || '';
  }
  cardMsg.style.display = msgEl.textContent ? '' : 'none';

  // Config section — null means "keep current" (used for READING re-read)
  if (showConfig !== null) configSection.style.display = showConfig ? '' : 'none';

  btnRead.disabled  = !readEn;
  btnWrite.disabled = !writeEn;

  btnConnect.disabled   = !connectEn;
  btnConnect.textContent = connectText;
  btnConnect.className  = connectClass ? 'disconnect' : '';
}

setState('IDLE');

// ---------------------------------------------------------------------------
// Serial transport
// ---------------------------------------------------------------------------

let port = null;
let writer = null;
let readLoopRunning = false;
let slipDecoder = null;
let pendingResolve = null;
let pendingReject  = null;
let pendingTimeout = null;

async function readLoop() {
  const reader = port.readable.getReader();
  try {
    while (readLoopRunning) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) {
        const allPrintable = [...value].every(b => (b >= 0x20 && b < 0x7f) || b === 0x0a || b === 0x0d);
        if (allPrintable) log(new TextDecoder().decode(value).trimEnd());
        slipDecoder.feed(value);
      }
    }
  } catch (e) {
    if (readLoopRunning) log('[read error] ' + e.message);
  } finally {
    reader.releaseLock();
  }
}

function onSlipFrame(frame) {
  try {
    const obj = CBOR.decode(frame);
    log('[rx cbor] ' + JSON.stringify(obj));
    if (pendingResolve && typeof obj === 'object' && obj !== null && typeof obj.status === 'string') {
      clearTimeout(pendingTimeout);
      const res = pendingResolve;
      pendingResolve = null;
      pendingReject  = null;
      res(obj);
    }
  } catch (e) {
    log('[rx decode error] ' + e.message);
  }
}

function sendCommand(obj, timeoutMs = 5000) {
  return new Promise((resolve, reject) => {
    if (!writer) { reject(new Error('Not connected')); return; }
    pendingResolve = resolve;
    pendingReject  = reject;
    pendingTimeout = setTimeout(() => {
      pendingResolve = null;
      pendingReject  = null;
      reject(new Error('Response timeout'));
    }, timeoutMs);
    const cbor  = CBOR.toBytes(obj);
    const frame = slipEncode(cbor);
    log('[tx] ' + JSON.stringify(obj));
    writer.write(frame);
  });
}

async function closePort() {
  readLoopRunning = false;
  if (pendingReject) { pendingReject(new Error('Disconnected')); pendingReject = null; pendingResolve = null; }
  try { if (writer) { writer.releaseLock(); writer = null; } } catch (_) {}
  try { if (port)   { await port.close();   port   = null; } } catch (_) {}
}

// ---------------------------------------------------------------------------
// Connection flow
// ---------------------------------------------------------------------------

async function connect() {
  if (!('serial' in navigator)) {
    setState('IDLE', 'Web Serial API not supported. Use Chrome or Edge.');
    return;
  }
  setState('CONNECTING');
  try {
    port   = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    slipDecoder    = new SlipDecoder(onSlipFrame);
    readLoopRunning = true;
    readLoop();
    log('[port open]');

    // Handshake — confirm device is in config mode
    let pingOk = false;
    try {
      const resp = await sendCommand({ cmd: 'ping' }, 1500);
      pingOk = true; // any response = RX task is running = device is in config mode
      if (resp.status === 'ok') log('[handshake] mode=' + resp.mode + ' fw=' + resp.fw);
      else log('[handshake] device responded (legacy firmware, no ping support)');
    } catch (e) {
      log('[handshake failed] ' + e.message);
    }

    if (!pingOk) {
      await closePort();
      setState('HANDSHAKE_FAILED');
      return;
    }

    await readFromDevice();
  } catch (e) {
    await closePort();
    setState('IDLE', 'Connection failed: ' + e.message);
    log('[connect error] ' + e.message);
  }
}

async function disconnect() {
  await closePort();
  setState('IDLE');
  log('[disconnected]');
}

// ---------------------------------------------------------------------------
// Read from device
// ---------------------------------------------------------------------------

async function readFromDevice() {
  setState('READING');
  try {
    const resp = await sendCommand({ cmd: 'read' });
    if (resp.status !== 'ok') {
      setState('ERROR', 'Device error: ' + (resp.msg || resp.status));
      return;
    }
    const slots = resp.slots;
    if (!Array.isArray(slots) || slots.length !== MAX_SLOTS) {
      setState('ERROR', 'Unexpected response format');
      return;
    }
    for (let i = 0; i < MAX_SLOTS; i++) {
      document.getElementById(`l1-${i}`).value   = slots[i].l1 ?? '';
      document.getElementById(`l2-${i}`).value   = slots[i].l2 ?? '';
      document.getElementById(`en-${i}`).checked = !!slots[i].en;
      updateRowStyle(i);
    }
    setState('READY');
  } catch (e) {
    setState('ERROR', 'Read error: ' + e.message);
    log('[read error] ' + e.message);
  }
}

btnRead.addEventListener('click', () => {
  if (appState === 'READY' || appState === 'ERROR') readFromDevice();
});

// ---------------------------------------------------------------------------
// Write confirmation modal
// ---------------------------------------------------------------------------

const modalOverlay = document.getElementById('modal-overlay');
const modalSlots   = document.getElementById('modal-slots');
const modalCancel  = document.getElementById('modal-cancel');
const modalConfirm = document.getElementById('modal-confirm');

function showWriteConfirm(slots) {
  return new Promise(resolve => {
    modalSlots.innerHTML = '';
    slots.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'modal-slot-row';
      if (s.en) {
        row.innerHTML = `
          <span class="modal-slot-num">${i + 1}</span>
          <div class="modal-slot-labels">
            <span class="modal-slot-label">${s.l1}</span>
            <span class="modal-slot-label">${s.l2}</span>
          </div>`;
      } else {
        row.innerHTML = `
          <span class="modal-slot-num">${i + 1}</span>
          <span class="modal-slot-disabled">disabled</span>`;
      }
      modalSlots.appendChild(row);
    });

    setState('CONFIRMING');
    modalOverlay.classList.add('visible');

    function finish(result) {
      modalOverlay.classList.remove('visible');
      modalCancel.removeEventListener('click', onCancel);
      modalConfirm.removeEventListener('click', onConfirm);
      resolve(result);
    }
    function onCancel()  { setState('READY'); finish(false); }
    function onConfirm() { finish(true); }

    modalCancel.addEventListener('click', onCancel);
    modalConfirm.addEventListener('click', onConfirm);
  });
}

// ---------------------------------------------------------------------------
// Write to device
// ---------------------------------------------------------------------------

btnWrite.addEventListener('click', async () => {
  if (appState !== 'READY') return;

  // Validate
  let errorMsg = null;
  let enabledCount = 0;
  for (let i = 0; i < MAX_SLOTS; i++) {
    document.getElementById(`l1-${i}`).classList.remove('error');
    document.getElementById(`l2-${i}`).classList.remove('error');
  }
  const slots = [];
  for (let i = 0; i < MAX_SLOTS; i++) {
    const l1 = document.getElementById(`l1-${i}`).value.trim();
    const l2 = document.getElementById(`l2-${i}`).value.trim();
    const en = document.getElementById(`en-${i}`).checked;
    if (!l1)        { document.getElementById(`l1-${i}`).classList.add('error'); errorMsg = errorMsg || `Slot ${i + 1}: Line 1 is empty`; }
    if (!l2)        { document.getElementById(`l2-${i}`).classList.add('error'); errorMsg = errorMsg || `Slot ${i + 1}: Line 2 is empty`; }
    if (l1.length > 8) { document.getElementById(`l1-${i}`).classList.add('error'); errorMsg = errorMsg || `Slot ${i + 1}: Line 1 exceeds 8 characters`; }
    if (l2.length > 8) { document.getElementById(`l2-${i}`).classList.add('error'); errorMsg = errorMsg || `Slot ${i + 1}: Line 2 exceeds 8 characters`; }
    if (en) enabledCount++;
    slots.push({ l1, l2, en });
  }
  if (errorMsg)        { msgEl.textContent = errorMsg; msgEl.className = 'error'; return; }
  if (enabledCount === 0) { msgEl.textContent = 'At least one slot must be enabled.'; msgEl.className = 'error'; return; }

  const confirmed = await showWriteConfirm(slots);
  if (!confirmed) return;

  setState('WRITING');
  try {
    const writeResp = await sendCommand({ cmd: 'write', slots }, 8000);
    if (writeResp.status !== 'ok') {
      setState('ERROR', 'Write error: ' + (writeResp.msg || writeResp.status));
      return;
    }
    setState('REBOOTING');
    await new Promise(r => setTimeout(r, 300));
    try {
      const rebootResp = await sendCommand({ cmd: 'reboot' }, 3000);
      log('[reboot] ' + JSON.stringify(rebootResp));
    } catch (_) { /* expected — device disconnects */ }
    log('[done] device rebooted');
    await disconnect();
  } catch (e) {
    setState('ERROR', 'Write error: ' + e.message);
    log('[write error] ' + e.message);
  }
});

// ---------------------------------------------------------------------------
// Connect / disconnect button
// ---------------------------------------------------------------------------

btnConnect.addEventListener('click', async () => {
  if (appState === 'IDLE' || appState === 'HANDSHAKE_FAILED') {
    await connect();
  } else if (['READING', 'READY', 'ERROR'].includes(appState)) {
    await disconnect();
  }
});
</script>
